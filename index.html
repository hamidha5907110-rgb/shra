<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowMarket | Buy & Sell Anything</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Elements -->
    <div class="bg-shape circle-1"></div>
    <div class="bg-shape circle-2"></div>

    <header class="glass-header">
        <h1>GlowMarket</h1>
        <nav>
            <a href="#purchase-section">Shop</a>
            <a href="#sell-section" class="glow-btn">Sell an Item</a>
        </nav>
    </header>

    <main>
        <!-- Purchase Section -->
        <section id="purchase-section">
            <h2 class="section-title">Available Items</h2>
            <div id="product-grid" class="grid-container">
                <!-- Products will be dynamically injected here via JS -->
            </div>
        </section>

        <!-- Sell Section -->
        <section id="sell-section">
            <h2 class="section-title">Sell Your Item</h2>
            <div class="glass-container">
                <form id="sell-form" class="glass-form">
                    <div class="input-group">
                        <label for="itemName">Product Name</label>
                        <input type="text" id="itemName" required placeholder="e.g., Wireless Earbuds">
                    </div>
                    <div class="input-group">
                        <label for="itemPrice">Price ($)</label>
                        <input type="number" id="itemPrice" required placeholder="e.g., 49.99">
                    </div>
                    <div class="input-group">
                        <label for="itemImage">Image URL</label>
                        <input type="url" id="itemImage" required placeholder="https://example.com/image.png">
                    </div>
                    <div class="input-group">
                        <label for="itemDesc">Description</label>
                        <textarea id="itemDesc" rows="3" required placeholder="Describe your item..."></textarea>
                    </div>
                    <button type="submit" class="glow-btn submit-btn">List Item for Sale</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
